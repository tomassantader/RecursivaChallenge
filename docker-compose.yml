services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: horoscope-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Admin@123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1' | /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Admin@123!'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: HoroscopeChallenge.Api/Dockerfile
    container_name: horoscope-api
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HoroscopeChallengeDb;User Id=sa;Password=Admin@123!;TrustServerCertificate=True"

volumes:
  sql_data: